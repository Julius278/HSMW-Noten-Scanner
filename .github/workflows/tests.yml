name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 ist die Mindestversion (tomllib aus der Standardbibliothek).
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Abhängigkeiten installieren
        run: python -m pip install --upgrade pip -r python/requirements.txt

      - name: Tests ausführen
        # Die Tests starten einen lokalen HTTP-Server auf 127.0.0.1 und bilden
        # damit den Login-Ablauf nach - es wird bewusst keine Verbindung zum
        # echten Hochschulportal aufgebaut.
        run: python -m unittest discover -s python -v

  javascript:
    name: ioBroker-Script (Node.js ${{ matrix.node-version }}${{ matrix.cheerio && format(', cheerio {0}', matrix.cheerio) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Das Script selbst kommt mit Node 18 aus (globales fetch()), das
        # gelockte cheerio 1.x aber nicht: es setzt Node >=20.18.1 voraus und
        # lädt undici, das den erst ab Node 20 globalen File-Konstruktor
        # braucht - sonst scheitert schon das require mit "File is not
        # defined". Node 18 wird deshalb gegen cheerio 1.0.0-rc.12 getestet,
        # den im README dokumentierten Weg für ältere Installationen.
        include:
          - node-version: "20"
          - node-version: "22"
          - node-version: "24"
          - node-version: "18"
            cheerio: "1.0.0-rc.12"

    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: iobroker/package-lock.json

      - name: Abhängigkeiten installieren (gelockte Versionen)
        if: ${{ !matrix.cheerio }}
        run: npm ci
        working-directory: iobroker

      - name: Abhängigkeiten installieren (cheerio gepinnt)
        # Bewusst kein "npm ci" davor: das würde erst das für diese
        # Node-Version unbrauchbare cheerio 1.x herunterladen.
        if: ${{ matrix.cheerio }}
        run: npm install --no-save --no-package-lock cheerio@${{ matrix.cheerio }}
        working-directory: iobroker

      - name: Verwendete cheerio-Version melden
        # Bewusst über den relativen Pfad: cheerio 1.0.0-rc.12 gibt
        # "./package.json" in seinem exports-Feld nicht frei, ein
        # require('cheerio/package.json') scheitert dort.
        run: node -p "'cheerio ' + require('./node_modules/cheerio/package.json').version + ' auf Node ' + process.version"
        working-directory: iobroker

      - name: Syntax prüfen
        run: node --check hsmw-noten-scanner.js
        working-directory: iobroker

      - name: Tests ausführen
        # Die Tests stubben die ioBroker-Globals und starten einen lokalen
        # HTTP-Server, der den Login-Ablauf nachbildet - auch hier ohne
        # Verbindung zum echten Hochschulportal.
        run: npm test
        working-directory: iobroker
