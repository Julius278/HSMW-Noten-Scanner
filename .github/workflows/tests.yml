name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 ist die Mindestversion (tomllib aus der Standardbibliothek).
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Abhängigkeiten installieren
        run: python -m pip install --upgrade pip -r python/requirements.txt

      - name: Tests ausführen
        # Die Tests starten einen lokalen HTTP-Server auf 127.0.0.1 und bilden
        # damit den Login-Ablauf nach - es wird bewusst keine Verbindung zum
        # echten Hochschulportal aufgebaut.
        run: python -m unittest discover -s python -v

  javascript:
    name: ioBroker-Script prüfen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax prüfen
        # Für das ioBroker-Script gibt es keine Testsuite (es läuft nur in der
        # Adapter-Sandbox mit deren Globals). Der Syntax-Check verhindert
        # zumindest, dass ein Tippfehler unbemerkt ins Repository kommt.
        run: node --check iobroker/hsmw-noten-scanner.js
