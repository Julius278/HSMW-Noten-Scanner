name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 ist die Mindestversion (tomllib aus der Standardbibliothek).
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Abhängigkeiten installieren
        run: python -m pip install --upgrade pip -r python/requirements.txt

      - name: Tests ausführen
        # Die Tests starten einen lokalen HTTP-Server auf 127.0.0.1 und bilden
        # damit den Login-Ablauf nach - es wird bewusst keine Verbindung zum
        # echten Hochschulportal aufgebaut.
        run: python -m unittest discover -s python -v

  javascript:
    name: ioBroker-Script (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Das Script selbst käme mit Node 18 aus (globales fetch()), die
        # aktuelle cheerio-Version aber nicht: cheerio 1.x setzt Node
        # >=20.18.1 voraus und lädt undici, das den erst ab Node 20 globalen
        # File-Konstruktor braucht ("File is not defined"). Getestet wird
        # daher ab 20. Für Node 18 muss cheerio 1.0.0-rc.12 verwendet werden
        # (siehe README).
        node-version: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: iobroker/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci
        working-directory: iobroker

      - name: Syntax prüfen
        run: node --check hsmw-noten-scanner.js
        working-directory: iobroker

      - name: Tests ausführen
        # Die Tests stubben die ioBroker-Globals und starten einen lokalen
        # HTTP-Server, der den Login-Ablauf nachbildet - auch hier ohne
        # Verbindung zum echten Hochschulportal.
        run: npm test
        working-directory: iobroker
